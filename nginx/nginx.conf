map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Default i Nginx (1M) eshte shume i vogel per foto produktesh/AI
    # (product_image.py, image_analysis.py, image_search.py pranojne
    # UploadFile) - nje foto e zakonshme telefoni e kalon lehte 1MB.
    client_max_body_size 20M;

    # /api/* -> backend (FastAPI). Te gjitha ruget e backend-it jane
    # nen prefiksin /api qe i shpetojne perplasjes me faqet SSR te
    # frontend-it (p.sh. /products/123 eshte njekohesisht faqe SSR
    # dhe endpoint API - shih docs/faza/faza-6-docker-deploy-cicd.md).
    location /api/ws {
        proxy_pass http://backend:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gjithcka tjeter -> frontend (TanStack Start SSR)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
