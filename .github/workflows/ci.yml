name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # S'ka teste automatike akoma (shih docs/faza/faza-1-backend-db-auth-products.md,
    # "Probleme / Çështje të Hapura") - kjo eshte nje kontroll minimal importi,
    # jo nje test suite reale. Zevendesohet me pytest kur te shtohen teste.
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/thrifted
      SECRET_KEY: ci-dummy-secret
      FRONTEND_URL: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Kontroll import (zbulon gabime sintakse/importesh)
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # bun run lint eshte qellimisht i hequr per tani - dhjetra skedare
      # kane gabime paraekzistuese CRLF/pikepresje (prettier/prettier),
      # e panderlidhur me kete pune; shih faza-6 "Probleme/Ceshtje te Hapura".
      - run: bun run build
